name: Hostinger Release Package

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main push CI run for this exact commit
        required: true
        type: string

concurrency:
  group: hostinger-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Require successful CI for this exact main commit
        run: node scripts/verify-release-ci.js
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Build (CI-safe)
        run: npm run build:ci
        env:
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}

      - name: Validate production env snapshot
        if: ${{ vars.HOSTINGER_VALIDATE_ENV == 'true' }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          ADMIN_LOGIN_ID: ${{ secrets.ADMIN_LOGIN_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          DIGITALOCEAN_SPACES_ACCESS_KEY: ${{ secrets.DIGITALOCEAN_SPACES_ACCESS_KEY }}
          DIGITALOCEAN_SPACES_SECRET_KEY: ${{ secrets.DIGITALOCEAN_SPACES_SECRET_KEY }}
          DIGITALOCEAN_SPACES_BUCKET: ${{ secrets.DIGITALOCEAN_SPACES_BUCKET }}
          DIGITALOCEAN_SPACES_REGION: ${{ secrets.DIGITALOCEAN_SPACES_REGION }}
          DIGITALOCEAN_SPACES_CDN_BASE_URL: ${{ secrets.DIGITALOCEAN_SPACES_CDN_BASE_URL }}
          EPAPER_FORCE_STORAGE: ${{ secrets.EPAPER_FORCE_STORAGE }}
          EPAPER_STORAGE_UPLOADS_BASE_DIR: ${{ secrets.EPAPER_STORAGE_UPLOADS_BASE_DIR }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: npm run verify:prod-env

      - name: Create Hostinger upload package
        run: npm run package:hostinger-upload

      - name: Upload Hostinger package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lokswami-hostinger-upload
          path: |
            lokswami-upload.zip
            release-evidence.json
          if-no-files-found: error
          retention-days: 7
