name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify dependency security floor
        run: npm run verify:dependency-security

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build (CI-safe)
        run: npm run build:ci
        env:
          NEXT_PUBLIC_GTM_ID: 'GTM-CITEST'

      - name: Critical browser smoke (production build)
        run: npx playwright test tests/e2e/admin-critical-flows.spec.js tests/e2e/audience-readiness.spec.js
        env:
          DISABLE_REQUEST_LOG: 'true'
          AUTH_SECRET: 'ci-browser-smoke-only-not-a-production-secret'
          AUTH_TRUST_HOST: 'true'
          NEXTAUTH_URL: 'http://localhost:3000'
